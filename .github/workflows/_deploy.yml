name: Deploy environment (reusable)

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        run: |
          # Keep whatever image is currently running; fall back to the placeholder on the first deploy.
          APP="correlaite-${{ inputs.environment }}-api"
          IMAGE=$(az containerapp show -g "$RG" -n "$APP" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          IMAGE=${IMAGE:-mcr.microsoft.com/k8se/quickstart:latest}
          az deployment group create -g "$RG" -f infra/main.bicep \
            -p environmentName=${{ inputs.environment }} \
               postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' \
               adminEmails='${{ vars.ADMIN_EMAILS }}' \
               apiImage="$IMAGE" \
               appUrl='${{ vars.APP_URL }}' \
               azureOpenAiEndpoint='${{ vars.AZURE_OPENAI_ENDPOINT }}' \
               azureOpenAiDeployment='${{ vars.AZURE_OPENAI_DEPLOYMENT }}' \
            --query "properties.outputs" -o json > outputs.json
          for k in acrName acrLoginServer apiAppName swaName siteUrl; do
            echo "$k=$(jq -r ".$k.value" outputs.json)" >> "$GITHUB_OUTPUT"
          done

      - name: Build API image in ACR
        run: az acr build -r "${{ steps.infra.outputs.acrName }}" -t "api:${{ github.sha }}" api

      - name: Roll out API (migrations run on container start)
        run: |
          az containerapp update -g "$RG" -n "${{ steps.infra.outputs.apiAppName }}" \
            --image "${{ steps.infra.outputs.acrLoginServer }}/api:${{ github.sha }}"

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Get Static Web App deployment token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list -g "$RG" -n "${{ steps.infra.outputs.swaName }}" --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        run: |
          URL="${{ steps.infra.outputs.siteUrl }}/api/health"
          for i in $(seq 1 20); do
            if curl -fsS "$URL"; then exit 0; fi
            sleep 15
          done
          echo "Health check failed: $URL" && exit 1
